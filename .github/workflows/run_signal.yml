name: Weekly ETF Signal

on:
  schedule:
    # 每天 UTC 09:00 运行（对应北京时间 17:00）
    - cron: '0 9 * * *'
  # 允许在 GitHub Actions 页面手动点击触发
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Refresh results through YYYY-MM-DD without sending a notification; leave empty for the normal weekly signal'
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly signal script
        run: |
          if [ -n "$REFRESH_AS_OF" ]; then
            PYTHONPATH=. python -m src.refresh_results --as-of "$REFRESH_AS_OF" --output-dir ETF_Result
          else
            PYTHONPATH=. python scripts/send_weekly_signal.py
          fi
        env:
          REFRESH_AS_OF: ${{ inputs.as_of }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}

      - name: Save refreshed market data and strategy results
        if: ${{ success() && hashFiles('ETF_Result/refresh_manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: etf-rotation-results
          path: ETF_Result/
          retention-days: 30
